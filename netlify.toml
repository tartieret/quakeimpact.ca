[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Static export ships no server. Stop Netlify's Next.js Runtime from
  # auto-attaching and provisioning functions for a build that has none.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /shaking/secondary-hazards/ was one page holding landslides, dikes and dams.
# It is now three, and the old URL is live on the site and in search results.
[[redirects]]
  from = "/shaking/secondary-hazards/"
  to = "/shaking/landslides/"
  status = 301
