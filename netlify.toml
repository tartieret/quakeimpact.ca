[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Static export ships no server. Stop Netlify's Next.js Runtime from
  # auto-attaching and provisioning functions for a build that has none.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site's Netlify address serves the same files as quakeimpact.ca. Each page's
# canonical link already names the real domain, but a redirect leaves a crawler
# nothing to reconcile. Deploy previews have hosts of their own and are not
# caught by this rule.
[[redirects]]
  from = "https://quakeimpact.netlify.app/*"
  to = "https://quakeimpact.ca/:splat"
  status = 301
  force = true

# /shaking/secondary-hazards/ was one page holding landslides, dikes and dams.
# It is now three, and the old URL is live on the site and in search results.
[[redirects]]
  from = "/shaking/secondary-hazards/"
  to = "/shaking/landslides/"
  status = 301

# The social card was /opengraph-image before it was /card.png. A link preview
# already scraped keeps the old address and fetches it again.
[[redirects]]
  from = "/opengraph-image"
  to = "/card.png"
  status = 301
