[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Static export ships no server. Stop Netlify's Next.js Runtime from
  # auto-attaching and provisioning functions for a build that has none.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The social card. Next writes a generated metadata image into the export with
# no file extension, so Netlify has nothing to infer a type from and serves it
# as a download; a link preview that cannot read image/png draws no card. The
# file is `src/app/opengraph-image.tsx` and the path is `CARD.path` in
# `src/content/metadata.ts`.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /shaking/secondary-hazards/ was one page holding landslides, dikes and dams.
# It is now three, and the old URL is live on the site and in search results.
[[redirects]]
  from = "/shaking/secondary-hazards/"
  to = "/shaking/landslides/"
  status = 301
